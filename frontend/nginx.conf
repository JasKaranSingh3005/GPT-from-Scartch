server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths (e.g. /training on reload) serve index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}